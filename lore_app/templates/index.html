<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lore</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/static/lore2/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/lore2/lore2.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/lore2/lore2-ui.css?v={{ asset_version }}">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #loreRoot { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
</head>
<body>
  <!--
    Lore2 UI shell. The dark "system" chrome theme tokens (--rose, --bg-*, --text-*,
    --reader-*, radii) are declared inline on .lore-app exactly as in the lore2 redesign,
    so every descendant — including the settings modal mounted inside — inherits them.
    All dynamic rendering happens in /static/lore2/app.js (external script: the app CSP
    allows inline styles but not inline scripts).
  -->
  <div class="lore-app" id="loreRoot" data-font="serif" style="position:fixed;inset:0;display:grid;grid-template-columns:284px minmax(0,1fr);grid-template-rows:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#000;color:var(--text-body);--rose:#ff8fbe;--rose-hover:#ff6da8;--rose-bg:rgba(255,143,190,.1);--rose-bg-strong:rgba(255,143,190,.15);--rose-border:rgba(255,143,190,.3);--rose-border-soft:rgba(255,143,190,.2);--rose-glow:rgba(255,143,190,.25);--bg-field:rgba(255,255,255,.04);--bg-hover:rgba(255,255,255,.08);--bg-inset:rgba(255,255,255,.025);--text-heading:#fff;--text-body:rgba(255,255,255,.85);--text-muted:rgba(255,255,255,.5);--text-dim:rgba(255,255,255,.4);--text-dimmer:rgba(255,255,255,.25);--separator:rgba(255,255,255,.06);--separator-strong:rgba(255,255,255,.1);--separator-hover:rgba(255,255,255,.18);--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:20px;--radius-full:9999px;--bg-elevated:rgba(255,255,255,.05);--rose-border-strong:rgba(255,143,190,.36);--rose-focus:rgba(255,143,190,.6);--rose-focus-ring:rgba(255,143,190,.12);--warning:#facc15;--warning-bg:rgba(250,204,21,.1);--positive:#22c55e;--positive-bg:rgba(34,197,94,.1);--error:#f87171;--error-bg:rgba(248,113,113,.1);--neutral:#6b7280;--neutral-bg:rgba(255,255,255,.08);--bg-surface:#1d1d1f;--bg-surface-2:#252528;--reader-bg:#252528;--reader-ink:rgba(255,255,255,.9);--reader-muted:rgba(255,255,255,.52);--reader-dim:rgba(255,255,255,.38);--reader-line:rgba(255,255,255,.1);--reader-link:var(--rose);--reader-code-bg:rgba(255,255,255,.06);--reader-card:var(--bg-elevated)">
    <noscript>
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;font-size:13px">This page requires JavaScript.</div>
    </noscript>
  </div>
  <script src="/static/lore2/app.js?v={{ asset_version }}" defer></script>
</body>
</html>
