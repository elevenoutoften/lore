name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      LORE_CONTENT_DIR: /tmp/lore-ci-pages
      LORE_SEARCH_DB: /tmp/lore-ci-db/search.db
      LORE_VECTOR_DB: /tmp/lore-ci-db/vectors.db
      LORE_LEDGER_DB: /tmp/lore-ci-db/ledger.db
      LORE_API_KEYS_DB: /tmp/lore-ci-db/api-keys.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: |
          rm -rf /tmp/lore-ci-db /tmp/lore-ci-pages
          mkdir -p /tmp/lore-ci-db /tmp/lore-ci-pages
          python -m pytest tests/ eval --timeout=60

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify wheel
        run: |
          python -m pip install dist/*.whl
          python -c "import lore_app; print('Package import OK')"

  python-sdk:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Python SDK
        run: |
          cd sdk/python
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest tests/ -v

  typescript-sdk:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build TypeScript SDK
        run: |
          cd sdk/typescript
          npm ci
          npm run build
      - name: Test TypeScript SDK
        run: |
          cd sdk/typescript
          npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t lore:ci-test .
      - name: Verify container starts
        run: |
          docker run -d --name lore-ci -p 8101:8000 \
            -e LORE_AUTH_MODE=bearer \
            -e LORE_AUTH_SECRET=ci-test-secret \
            -e LORE_CONTENT_DIR=/tmp/pages \
            -e LORE_SEARCH_DB=/tmp/db/search.db \
            -e LORE_VECTOR_DB=/tmp/db/vectors.db \
            -e LORE_LEDGER_DB=/tmp/db/ledger.db \
            -e LORE_API_KEYS_DB=/tmp/db/api_keys.db \
            lore:ci-test
          sleep 5
          curl -f -H "Authorization: Bearer ci-test-secret" http://localhost:8101/healthz || (docker logs lore-ci && exit 1)
          docker stop lore-ci
          docker rm lore-ci
