[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lore"
version = "0.3.0b1"
description = "Markdown-backed LLM wiki and project registry."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "nh3>=0.2,<1.0",
  "fastapi>=0.111,<1.0",
  "jinja2>=3.1,<4.0",
  "markdown-it-py[linkify]>=4,<5",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "uvicorn[standard]>=0.29,<1.0"
]

[project.scripts]
lore = "lore_app.cli:main"

[project.optional-dependencies]
dense = [
  "sqlite-vec>=0.1,<0.2",
]
test = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0",
  "pytest-timeout>=2.3,<3.0",
  "pytest-cov>=5.0,<7.0",
  "sqlite-vec>=0.1,<0.2",
]
browser = [
  "playwright>=1.40,<2.0",
]
dev = [
  "lore[test]",
  "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
include = ["lore_app*"]

[tool.setuptools.package-data]
lore_app = ["templates/*.html", "static/*.css", "static/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
pythonpath = ["."]
markers = [
  "benchmark: performance benchmarks with generous regression thresholds"
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["lore_app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lore_app"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["lore_app"]
omit = ["lore_app/__main__.py"]

[tool.coverage.report]
fail_under = 50
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "pass",
]
